config_version: v1            # manifest schema version (omit = legacy v0)
name: sec-af
version: 0.1.0
description: Security review agent node (scans repositories for vulnerabilities)
author: Agent-Field

# The Go node in go/ is the maintained security-audit node: same reasoners, same
# interface, one static binary, no per-node venv to build. Installing this repo
# installs that instead — so `af install https://github.com/Agent-Field/sec-af`
# is the one thing a user has to know, before and after the switch.
#
# go/ declares this same name deliberately, so the switch is a replacement in
# place: same node id, same triggers, node-scoped secrets kept. Only one of the
# two can be installed at a time, which is the point.
#
# This manifest stays here as the redirect, so the Python node is still what
# `python -m sec_af.app` and docker-compose run. The redirect is a git-install
# behaviour only: to install this node deliberately, clone the repo and install
# the checkout as a local path.
superseded_by: https://github.com/Agent-Field/sec-af//go

entrypoint:
  start: python -m sec_af.app
  healthcheck: /health

agent_node:
  node_id: sec-af
  default_port: 8080

user_environment:
  required:
    - name: OPENROUTER_API_KEY
      description: LLM provider key (OpenRouter)
      type: secret
      scope: global
  optional:
    - name: AGENTFIELD_SERVER
      description: Control-plane URL
      default: http://localhost:8080
    - name: AGENTFIELD_API_KEY
      description: Control-plane API key (if auth is enabled)
      type: secret
      scope: global
    - name: HARNESS_PROVIDER
      description: Coding-agent harness provider (aforge | claude-code | codex | gemini | opencode)
      default: aforge
    - name: AGENTFIELD_AFORGE_COMMAND
      description: AForge headless command the SDK runs (`exec` or `do`); agentfield>=0.1.130 reads it, default `exec`
      default: exec
    - name: SEC_AF_AFORGE_BIN
      description: Optional path to the AForge binary (defaults to aforge on PATH)
    - name: HARNESS_MODEL
      description: Model the harness uses
      default: openrouter/moonshotai/kimi-k2.5
    - name: AI_MODEL
      description: Model for direct AI calls
      default: openrouter/moonshotai/kimi-k2.5
    - name: SEC_AF_WORKSPACES_DIR
      description: Directory where repos to scan are cloned (falls back to ~/.sec-af/workspaces if not writable)
      default: /workspaces
